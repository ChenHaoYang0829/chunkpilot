plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'java'
}
version = rootProject.modVersion
group = rootProject.modGroup
def fabMC = "26.2"
def fabLoader = "0.19.5"
def fabApi = "0.161.0+26.2"
repositories {
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://maven.architectury.dev/" }
    gradlePluginPortal()
}
dependencies {
    // 2026-09-24 (port/26.2): MC 26.x **不再混淆**(26.1 起官方 jar 直接是 Mojang 名),
    //   因此: ① 没有 mappings 可下(26.2 的 version.json 里没有 client_mappings/server_mappings,
    //   loom.officialMojangMappings() 会抛 "Failed to find official mojang mappings for 26.2");
    //   ② 必须用 **不重映射** 的插件变体 `net.fabricmc.fabric-loom`(1.14+ 起提供, 实现类
    //   LoomNoRemapGradlePlugin), 它跳过所有 remap; ③ mod 依赖改用普通 implementation
    //   (官方指引: "Any use of modImplementation ... should be switched out for the standard
    //   implementation or compileOnly"); ④ 产物由 jar 直接给出(没有 remapJar)。
    minecraft "com.mojang:minecraft:${fabMC}"
    implementation "net.fabricmc:fabric-loader:${fabLoader}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabApi}"
    // 2026-09-24 死代码盘点: 这行显式 pin 是多余的 —— fabric-api 聚合包已包含 networking-api-v1,
    //   且该 pin 的版本 (4.3.3) 与 fabric-api 版本不一致, 注释"1.21.2 需要"也已过时 (模块早已是 1.21.3)。
    //   实测删除后 :fabric:build 仍 BUILD SUCCESSFUL。networking 能力本身由 fabric-api 提供, 不受影响。

    // P1.1: 静态反射检查 — fabric 测试也要 JUnit
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
loom {
    mods { "chunkpilot" { sourceSet sourceSets.main } }
    // 2026-08-02: 分配 16GB 堆给测试服
    runServer {
        jvmArgs '-Xmx16G', '-Xms4G'
    }
}
// 2026-09-24 (port/26.2): 不再启用 legacy mixin AP / refmap。
//   26.x 的运行期命名空间 == 编译期命名空间(Mojang 官方名), mixin 注解里的目标名可以**直接命中**,
//   不需要 refmap 把 official 名翻译成 intermediary。继续生成 intermediary refmap 反而会
//   让注解被改写成不存在的 intermediary 名(class_xxxx)而静默失效(见 1.21.11 报告 §7.3 的同类坑)。
// 引用 common 源码 (不依赖 common 项目, 避免 architectury classpath 污染)
sourceSets {
    main {
        java {
            srcDir project(':common').sourceSets.main.java
        }
        resources {
            srcDir project(':common').sourceSets.main.resources
        }
    }
    // P1.1: 静态反射测试 — 需要 loom 把 remap 后 MC 类加入 test classpath
    test {
        java.srcDir 'src/test/java'
        resources.srcDir 'src/test/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// P1.1: 静态反射测试 task 配置
test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
        exceptionFormat = 'full'
    }
}
// 2026-08-01: 1.21.2 fabric-api 拆分了 client 模块, 显式加 client networking
dependencies {
}

// 2026-09-24: 让元数据里的 MC 版本从构建变量展开, 而不是手写 ——
//   手写极容易漏改(实测出现过"1.21.5 的 jar 里写着 minecraft=1.21.3"⇒ 在 1.21.5 上被 loader 直接拒绝加载)。
processResources {
    inputs.property "mcVersion", fabMC
    inputs.property "modVersion", rootProject.modVersion
    filesMatching("fabric.mod.json") {
        expand(mcVersion: fabMC, modVersion: rootProject.modVersion)
    }
}
