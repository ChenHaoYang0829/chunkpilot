pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://repo.papermc.io/repository/maven-public/" }
        maven { url "https://maven.minecraftforge.net/" }
        mavenCentral()
        gradlePluginPortal()
    }

    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == "dev.architectury.loom") {
                useModule("dev.architectury:architectury-loom:${requested.version}")
            }
            // 2026-09-24 (port/26.3): 26.x 起 MC 官方 jar 不再混淆 ⇒ **没有 mappings 可解析**,
            //   带 remap 的 `dev.architectury.loom` 在配置期必然失败
            //   ("Configuration 'mappings' has no dependencies")。
            //   architectury-loom 1.17 同时提供 no-remap 变体的 plugin id, 实现 jar 与上面**同一个**
            //   (plugin marker pom 实证: dev.architectury.loom-no-remap.gradle.plugin → dev.architectury:architectury-loom)。
            if (requested.id.id == "dev.architectury.loom-no-remap") {
                useModule("dev.architectury:architectury-loom:${requested.version}")
            }
            if (requested.id.id == "architectury-plugin") {
                useModule("architectury-plugin:architectury-plugin.gradle.plugin:${requested.version}")
            }
            // 2026-08-01: fabric 官方 loom (fabric-loom-remap 是官方 1.21+ remap fork)
            if (requested.id.id == "net.fabricmc.fabric-loom-remap") {
                useModule("net.fabricmc.fabric-loom:net.fabricmc.fabric-loom.gradle.plugin:${requested.version}")
            }
            if (requested.id.id == "net.fabricmc.fabric-loom") {
                useModule("net.fabricmc.fabric-loom:net.fabricmc.fabric-loom.gradle.plugin:${requested.version}")
            }
        }
    }
}

rootProject.name = 'chunkpilot'

include 'common'
include 'fabric'
include 'neoforge'