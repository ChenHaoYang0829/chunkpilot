pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://repo.papermc.io/repository/maven-public/" }
        maven { url "https://maven.minecraftforge.net/" }
        mavenCentral()
        gradlePluginPortal()
    }

    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == "dev.architectury.loom") {
                useModule("dev.architectury:architectury-loom:${requested.version}")
            }
            if (requested.id.id == "architectury-plugin") {
                useModule("architectury-plugin:architectury-plugin.gradle.plugin:${requested.version}")
            }
            // 2026-08-01: fabric 官方 loom (fabric-loom-remap 是官方 1.21+ remap fork)
            if (requested.id.id == "net.fabricmc.fabric-loom-remap") {
                useModule("net.fabricmc.fabric-loom:net.fabricmc.fabric-loom.gradle.plugin:${requested.version}")
            }
            if (requested.id.id == "net.fabricmc.fabric-loom") {
                useModule("net.fabricmc.fabric-loom:net.fabricmc.fabric-loom.gradle.plugin:${requested.version}")
            }
        }
    }
}

rootProject.name = 'chunkpilot'

include 'common'
include 'fabric'
// port/1.21.9: 允许只构建 fabric (`-PskipNeoforge`).
// 原因: NeoForge 21.9.16-beta 的 :neoforge 项目在**配置阶段**就去解析 neoforge userdev +
//      整条 fancymodloader/modlauncher/securejarhandler 依赖链 (1.21.1 时靠 .local-maven-repo 垫的
//      那几个版本在 21.9 上全部要换), 实测单次配置 >10 分钟并反复卡住, 会把 :fabric:* 一起拖死。
//      不加该参数时行为与改动前**完全一致** (仍然 include 'neoforge')。
if (!gradle.startParameter.projectProperties.containsKey('skipNeoforge')) {
    include 'neoforge'
}