pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://repo.papermc.io/repository/maven-public/" }
        maven { url "https://maven.minecraftforge.net/" }
        mavenCentral()
        gradlePluginPortal()
    }

    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == "dev.architectury.loom") {
                useModule("dev.architectury:architectury-loom:${requested.version}")
            }
            if (requested.id.id == "architectury-plugin") {
                useModule("architectury-plugin:architectury-plugin.gradle.plugin:${requested.version}")
            }
            // 2026-08-01: fabric 官方 loom (fabric-loom-remap 是官方 1.21+ remap fork)
            if (requested.id.id == "net.fabricmc.fabric-loom-remap") {
                useModule("net.fabricmc.fabric-loom:net.fabricmc.fabric-loom.gradle.plugin:${requested.version}")
            }
            if (requested.id.id == "net.fabricmc.fabric-loom") {
                useModule("net.fabricmc.fabric-loom:net.fabricmc.fabric-loom.gradle.plugin:${requested.version}")
            }
        }
    }
}

rootProject.name = 'chunkpilot'

include 'common'
include 'fabric'
include 'neoforge'
// 2026-09-25: MC 1.20.1 的 Forge 产物专用模块 (分支 forge/1.20.1).
//   它与上面的 'neoforge' 模块是**两套东西**: 1.20.1 的 Forge 47.x 与 1.21.x 的
//   NeoForge 21.x 在构建插件 (architectury-loom 的 forge 平台 vs neoforge 平台)、
//   包命名空间 (net.minecraftforge.* vs net.neoforged.*)、网络 API 上完全不同,
//   所以必须是独立子项目, **不能**把 neoforge 掰弯成 Forge.
include 'forge'