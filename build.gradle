buildscript {
    configurations.classpath {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
    }
}

plugins {
    id 'dev.architectury.loom' version '1.13.469' apply false
    id 'architectury-plugin' version '3.5.169' apply false
}

ext {
    // 版本常量 —— port/1.21.2: 两个模块统一到 MC 1.21.2
    // 注意: fabric.mod.json 的 minecraft 与 neoforge.mods.toml 的 versionRange 都由构建期展开
    //   (dc2c337): fabric 用 fabMC, neoforge 由 minecraftVersion 自动算出精确区间 [1.21.2,1.21.3)。
    minecraftVersion = "1.21.2"

    // Fabric (PORT_MATRIX.md: fabric-api 0.106.1+1.21.2 / loader 0.19.5)
    fabricLoaderVersion = "0.19.5"
    fabricApiVersion = "0.106.1+1.21.2"
    yarnMappings = "1.21.2+build.1"   // 死变量 (全仓库无引用), 仅为坐标完整性保留

    // NeoForge —— MC 1.21.2 只有 beta 线 (PORT_MATRIX.md)
    //   注意: fancymodloader 4.0.29 → modlauncher 11.0.4, 公开仓库没有 ⇒ 依赖 .local-maven-repo
    neoforgeVersion = "21.2.1-beta"

    // Architectury —— 死变量: main 已彻底移除 architectury 依赖 (零使用)
    architecturyVersion = "14.0.4"

    // Mod
    // 1.0.0: 版本号统一 —— 本处 (jar 名) 与 fabric.mod.json / neoforge.mods.toml /
    //   ChunkPilot.VERSION 四处必须一致, 且都不再带 -alpha 后缀。
    modVersion = "1.0.0"
    modGroup = "com.chunkpilot"
    modId = "chunkpilot"
}

subprojects {
    apply plugin: 'java'
    // 2026-08-01: fabric 用官方 fabric-loom-remap, 不用 architectury loom/plugin
    if (project.name != 'fabric') {
        apply plugin: 'dev.architectury.loom'
        // 2026-09-24: 不再应用 'architectury-plugin' —— 它只服务 @ExpectPlatform 代码生成与本项目零使用的
        //   platformPackage 设置; 实测 :common:test / :neoforge:build 在移除后仍通过。
        //   (dev.architectury.loom 仍保留: 它是 common/neoforge 实际使用的 loom 实现。)
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    if (project.name != 'fabric') {
        loom {
            silentMojangMappingsLicense()
        }
    }

    // 2026-08-01: minecraft dependency 由各子项目自己设 (fabric 1.21.2, neoforge 1.21.1 不同)
    // 不在这里注入, 各子项目 build.gradle 自己声明

    repositories {
        mavenCentral()
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://repo.papermc.io/repository/maven-public/" }
        maven { url "https://maven.minecraftforge.net/" }
        maven { url "https://maven.parchmentmc.org/" }
    }

    group = modGroup
    version = modVersion

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}