buildscript {
    configurations.classpath {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
    }
}

plugins {
    id 'dev.architectury.loom' version '1.13.469' apply false
    id 'architectury-plugin' version '3.5.169' apply false
}

ext {
    // 版本常量 —— port/1.21.6: 坐标见 /data/openclaw/chunkpilot/PORT_MATRIX.md
    //   (merge main 时 main 上是 1.21.10 的坐标, 按收尾要求"保留自己的版本号"改回 1.21.6)
    minecraftVersion = "1.21.6"

    // Fabric (PORT_MATRIX 已核实: loader 0.19.5 / api 0.128.2+1.21.6)
    fabricLoaderVersion = "0.19.5"
    fabricApiVersion = "0.128.2+1.21.6"
    yarnMappings = "1.21.6+build.1"   // 当前未使用 (两个模块都用 officialMojangMappings)

    // NeoForge —— 21.6.20-beta = MC 1.21.6 线 (该线**只有 beta**, 见 PORT_MATRIX; 实测可安装可跑)
    neoforgeVersion = "21.6.20-beta"

    // Architectury —— 17.x 对应 MC ~1.21.6 (证据: architectury-fabric-17.0.6.jar 的
    // fabric.mod.json depends.minecraft = "~1.21.6")。merge main 后 neoforge 模块与
    // neoforge.mods.toml 里对 architectury 的依赖都已被死代码清理删除, 这个变量只剩记录作用。
    architecturyVersion = "17.0.6"
    
    // Mod
    // 1.0.0: 版本号统一 —— 本处 (jar 名) 与 fabric.mod.json / neoforge.mods.toml /
    //   ChunkPilot.VERSION 四处必须一致, 且都不再带 -alpha 后缀。
    modVersion = "1.0.0"
    modGroup = "com.chunkpilot"
    modId = "chunkpilot"
}

subprojects {
    apply plugin: 'java'
    // 2026-08-01: fabric 用官方 fabric-loom-remap, 不用 architectury loom/plugin
    if (project.name != 'fabric') {
        apply plugin: 'dev.architectury.loom'
        // 2026-09-24: 不再应用 'architectury-plugin' —— 它只服务 @ExpectPlatform 代码生成与本项目零使用的
        //   platformPackage 设置; 实测 :common:test / :neoforge:build 在移除后仍通过。
        //   (dev.architectury.loom 仍保留: 它是 common/neoforge 实际使用的 loom 实现。)
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    if (project.name != 'fabric') {
        loom {
            silentMojangMappingsLicense()
        }
    }

    // 2026-08-01: minecraft dependency 由各子项目自己设 (fabric 1.21.2, neoforge 1.21.1 不同)
    // 不在这里注入, 各子项目 build.gradle 自己声明

    repositories {
        mavenCentral()
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://repo.papermc.io/repository/maven-public/" }
        maven { url "https://maven.minecraftforge.net/" }
        maven { url "https://maven.parchmentmc.org/" }
    }

    group = modGroup
    version = modVersion

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}