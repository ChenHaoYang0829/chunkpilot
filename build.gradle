buildscript {
    configurations.classpath {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
    }
}

// 2026-09-24 (port/26.2): 这里原本声明 dev.architectury.loom / architectury-plugin。
//   MC 26.x 起官方 jar 不再混淆, **没有 mappings 可解析** ⇒ remap 版 loom 在配置期必然失败
//   ("Failed to find official mojang mappings for 26.2")。现在: fabric 用官方
//   `net.fabricmc.fabric-loom`(不重映射变体), neoforge 用官方 `net.neoforged.moddev`,
//   common 不需要 loom ⇒ 本工程**不再使用 architectury-loom**。

ext {
    // 版本常量
    minecraftVersion = "26.2"
    
    // Fabric
    fabricLoaderVersion = "0.19.5"
    fabricApiVersion = "0.161.0+26.2"
    yarnMappings = "26.2+build.1"
    
    // NeoForge
    neoforgeVersion = "26.2.0.88"
    
    // Architectury
    architecturyVersion = "19.0.1"
    
    // Mod
    // 1.0.0: 版本号统一 —— 本处 (jar 名) 与 fabric.mod.json / neoforge.mods.toml /
    //   ChunkPilot.VERSION 四处必须一致, 且都不再带 -alpha 后缀。
    modVersion = "1.0.0"
    modGroup = "com.chunkpilot"
    modId = "chunkpilot"
}

subprojects {
    apply plugin: 'java'
    // 2026-09-24 (port/26.2): 不再给 common/neoforge 应用 architectury-loom ——
    //   fabric 模块自带 net.fabricmc.fabric-loom(不重映射), neoforge 模块自带 net.neoforged.moddev,
    //   common 零 MC 引用(纯 java)。

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }


    // 2026-08-01: minecraft dependency 由各子项目自己设 (fabric 1.21.2, neoforge 1.21.1 不同)
    // 不在这里注入, 各子项目 build.gradle 自己声明

    repositories {
        mavenCentral()
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://repo.papermc.io/repository/maven-public/" }
        maven { url "https://maven.minecraftforge.net/" }
        maven { url "https://maven.parchmentmc.org/" }
    }

    group = modGroup
    version = modVersion

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}