plugins {
    id 'dev.architectury.loom'
}

dependencies {
    // 依赖 fabric loader 仅用于 @Environment 注解
    implementation "net.fabricmc:fabric-loader:${rootProject.fabricLoaderVersion}"

    // 2026-08-01: common 源码不含 MC 直接类型引用 (用 PlatformAbstraction 抽象层)
    // 但 loom 编译需要 MC, 这里给 fabric 的 1.21.2
    minecraft "com.mojang:minecraft:${rootProject.minecraftVersion}"

    // P0: 单元测试 — common 模块零 MC 引用, 测试也只用 JUnit + chunkpilot.* 类
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar.enabled = false

// P0: 测试配置 — common 是纯逻辑模块, 测试不依赖 MC classpath
sourceSets {
    test {
        java.srcDir 'src/test/java'
        resources.srcDir 'src/test/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
        exceptionFormat = 'full'
    }
}
