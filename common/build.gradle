plugins {
    id 'dev.architectury.loom'
}

dependencies {
    // 依赖 fabric loader 仅用于 @Environment 注解
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabricLoaderVersion}"

    // 2026-08-01: common 源码不含 MC 直接类型引用 (用 PlatformAbstraction 抽象层)
    // 但 loom 编译需要 MC.
    // 2026-09-24 (port/1.21.11): 这里**原本硬编码 1.21.2**, 与本 worktree 的 MC 版本无关.
    //   后果: 即使只跑 :fabric:build, Gradle 也会配置 :common → arch loom 去下载 MC 1.21.2
    //   的 client/server jar (共 ~90MB), 在慢代理下必然卡住整个构建.
    //   改为跟随 rootProject.minecraftVersion, 与 fabric/neoforge 共用同一份 loom 缓存.
    minecraft "com.mojang:minecraft:${rootProject.minecraftVersion}"
    mappings loom.officialMojangMappings()

    // P0: 单元测试 — common 模块零 MC 引用, 测试也只用 JUnit + chunkpilot.* 类
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar.enabled = false

// P0: 测试配置 — common 是纯逻辑模块, 测试不依赖 MC classpath
sourceSets {
    test {
        java.srcDir 'src/test/java'
        resources.srcDir 'src/test/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
        exceptionFormat = 'full'
    }
}
