// 2026-09-24 (port/26.2): common **不再应用任何 loom 插件**。
//   原因: common 源码零 MC 类型引用(`grep '^import net.minecraft' common/src` 为空, 已实证),
//   它只需要 fabric-loader 的 @Environment 注解。而 26.x 没有 mappings ⇒ remap 版 loom
//   (dev.architectury.loom) 在配置期就直接失败("Failed to find official mojang mappings for 26.2")。
//   去掉 loom 后 common 只是普通 java 模块, 构建更快且不再拖一份 MC 缓存。

dependencies {
    // 依赖 fabric loader 仅用于 @Environment 注解
    implementation "net.fabricmc:fabric-loader:${rootProject.fabricLoaderVersion}"


    // P0: 单元测试 — common 模块零 MC 引用, 测试也只用 JUnit + chunkpilot.* 类
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar.enabled = false

// P0: 测试配置 — common 是纯逻辑模块, 测试不依赖 MC classpath
sourceSets {
    test {
        java.srcDir 'src/test/java'
        resources.srcDir 'src/test/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
        exceptionFormat = 'full'
    }
}
