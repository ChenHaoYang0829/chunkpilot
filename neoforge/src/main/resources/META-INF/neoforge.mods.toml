modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = ""

[[mods]]
modId = "chunkpilot"
# port/1.21.3: 原来是 0.5.0-alpha (陈旧), 与 rootProject.modVersion / fabric.mod.json 的
#   0.10.10-alpha 不一致 —— 统一成同一个版本号
version = "0.10.10-alpha"
displayName = "ChunkPilot"
authors = "ChunkPilot Team"
description = '''
Smart chunk loading and rendering optimization for high-speed travel (elytra, trains, airships).
'''

[[dependencies.chunkpilot]]
modId = "neoforge"
type = "required"
# port/1.21.3: 21.3.x 是 MC 1.21.3 的 NeoForge 线
versionRange = "[21.3,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.chunkpilot]]
modId = "minecraft"
type = "required"
versionRange = "${mcRange}"
ordering = "NONE"
side = "BOTH"

# 2026-09-24 死代码清理: 原有一条 [[dependencies.chunkpilot]] modId="architectury" type="required" —— 已删除。
# 本模组代码零处使用 Architectury (无 @ExpectPlatform, 编译产物零引用), 那条声明只会逼玩家多装一个没用的 mod。
[[mixins]]
config = "chunkpilot.mixins.json"

[[mixins]]
config = "chunkpilot.client.mixins.json"