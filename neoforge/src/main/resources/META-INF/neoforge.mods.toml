modLoader = "javafml"
loaderVersion = "[12,)"   # NeoForge 26.3 用 fancymodloader 12.0.0 (pom 实证)
license = "MIT"
issueTrackerURL = ""

[[mods]]
modId = "chunkpilot"
version = "${modVersion}"
displayName = "ChunkPilot"
authors = "ChunkPilot Team"
description = '''
Smart chunk loading and rendering optimization for high-speed travel (elytra, trains, airships).
'''

[[dependencies.chunkpilot]]
modId = "neoforge"
type = "required"
versionRange = "[26.3,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.chunkpilot]]
modId = "minecraft"
type = "required"
versionRange = "${mcRange}"
ordering = "NONE"
side = "BOTH"

