repositories {
    // NeoForge 26.3 线用 fancymodloader 12.0.0 / modlauncher 公开版, 公开仓库即可解析,
    // **不再需要** main 里为 21.1.x 准备的 .local-maven-repo (那是 modlauncher 11.0.x 的历史包袱)。
    maven { url "https://maven.neoforged.net/releases" }
}

// ============================ 26.3: NeoForge 也不再需要混淆映射 ============================
// MC 从 26.1 起官方不再混淆, NeoForge 26.3.0.16-beta 随之把 sponge-mixin 提到 0.17.4
// (支持 JAVA_25), 并在 pom 里直接依赖真实的 MC 类名。javap 实证:
//   neoforge-26.3.0.16-beta 依赖 neoform 26.3-1, 而 neoform 的输入就是未混淆的官方 jar。
// 因此:
//   ① `mappings loom.officialMojangMappings()` 整行删除 (26.3 的 version.json 里**没有**
//      client_mappings/server_mappings 下载项, 这一行会直接失败);
//   ② main 里那个硬编码 refmap JSON 的 `fixRefmap` 任务**一并删除** —— refmap 的作用是
//      "编译期名 → 运行期名"的映射表, 现在两边同名, 不需要也**不应该**再生成
//      (声明了 refmap 却与真实命名不符, 反而是静默失效的温床);
//   ③ 产物仍在 build/devlibs/*-dev.jar (remapJar 依旧禁用)。

dependencies {
    // 26.3: modImplementation → implementation。
    //   no-remap 变体下没有"把依赖从 intermediary 重映射一遍"这回事; NeoForge 26.x 的 gradle
    //   module metadata 里 `modDevApiElements`(usage=java-api) 就是给普通 implementation 用的变体,
    //   它带齐 asm / fancymodloader 12.0.0 / bus 8.0.5 / sponge-mixin 0.17.4 / neoform 26.3-1。
    implementation "net.neoforged:neoforge:${rootProject.neoforgeVersion}"

    // 显式添加 FancyModLoader 和 Bus（NeoForge 26.3 的传递依赖）
    implementation "net.neoforged.fancymodloader:loader:12.0.0"
    implementation "net.neoforged.fancymodloader:earlydisplay:12.0.0"
    implementation "net.neoforged:bus:8.0.5"

    // SpongePowered Mixin（NeoForge 自带但需要显式引入编译路径）
    // 0.15.4 只认到 JAVA_22, 26.3 的 mixin class 是 major 69 (Java 25) ⇒ 必须 0.17.4
    implementation "net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7"

    // common 模块源码由下面 sourceSets.srcDir 直接引入并随本模块一起编译,
    // 因此**不能**再写 `implementation project(':common')` —— 那会把 :common:remapJar
    // 拖进构建图, 而 common 关掉了 jar (jar.enabled=false), 该任务必然失败。

    minecraft "com.mojang:minecraft:${rootProject.minecraftVersion}"
}

loom {
    mixin {
        // 26.3 无映射 ⇒ 不声明 refmap (留空即不生成), mixin 直接用源名匹配运行期名
        useLegacyMixinAp = false
    }

    runs {
        server {
            server()
        }
        client {
            client()
        }
    }
}

sourceSets {
    main {
        java {
            srcDir project(':common').sourceSets.main.java
        }
        resources {
            srcDir project(':common').sourceSets.main.resources
        }
    }
}

// 26.3: 这里原有 `tasks.named('remapJar'){enabled=false}` + 硬编码 refmap 的 fixRefmap 任务。
//   两者存在的唯一理由是"旧 loom 的 remapJar 会把 jar 重映射成 intermediary 命名, 而 NeoForge
//   运行期是官方名"。26.x MC 不再混淆且本模块已用 `dev.architectury.loom-no-remap`,
//   **没有 remapJar 任务** —— 产物直接在 build/libs/ 下, 类名就是运行期真名, refmap 一并删除。


// 2026-09-24: 元数据里的 MC 版本区间改为构建期从 rootProject.minecraftVersion 计算, 不再手写。
//   26.3 → [26.3,26.4)
def _mc = project.property('minecraftVersion').toString()
def _mcParts = _mc.tokenize('.')
def _mcNext = (_mcParts[0..-2] + [(_mcParts[-1] as int) + 1]).join('.')
def mcRange = "[${_mc},${_mcNext})"

processResources {
    inputs.property "mcRange", mcRange
    // 1.21.11 起 toml 里的 mod version 也改成构建期展开 (原先写死 0.5.0-alpha)
    inputs.property "modVersion", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand(mcRange: mcRange, modVersion: project.version)
    }
}
