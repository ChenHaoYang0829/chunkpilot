repositories {
    maven { url = file("../.local-maven-repo") }
    // port/1.21.3 (移植必须): root build.gradle 的 subprojects.repositories 里**没有**
    // maven.neoforged.net —— 之前靠 .local-maven-repo 放几个手抄 jar 兜底 (而且那只在
    // main 工作区里, 是未跟踪目录, worktree 根本没有), 于是 cpw.mods:modlauncher 直接解析失败:
    //   "Could not find cpw.mods:modlauncher:11.0.4 ... no maven.neoforged.net in the search list"
    // 实测 (走 HTTP 代理) maven.neoforged.net 上 modlauncher 11.0.4 / securejarhandler 3.0.8 /
    // bus 8.0.5 / coremods 7.0.3 / accesstransformers 11.0.1 / mergetool 2.0.0 / JarJar* 0.4.1 /
    // bootstraplauncher 2.0.2 / fancymodloader 5.0.8 / mixinextras-neoforge 0.5.3 全部 200 OK。
    maven { url "https://maven.neoforged.net/releases/" }
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        // 对齐 neoforge-21.3.97.pom 自己声明的版本 (FML loader 5.0.8 只要求 11.0.3 / 3.0.7,
        // 但 NeoForge 21.3.97 runtime 带的是 11.0.4 / 3.0.8, 编译期跟上避免签名不一致)
        if (details.requested.group == 'cpw.mods' && details.requested.name == 'modlauncher') {
            details.useVersion '11.0.4'
        }
        if (details.requested.group == 'cpw.mods' && details.requested.name == 'securejarhandler') {
            details.useVersion '3.0.8'
        }
    }
}

architectury {
    platformSetupLoomIde()
    neoForge {
        platformPackage = "forge"
    }
}

dependencies {
    modImplementation "net.neoforged:neoforge:${rootProject.neoforgeVersion}"

    // 显式添加 FancyModLoader 和 Bus（NeoForge 的传递依赖，但 NeoForge Maven 被墙无法自动解析）
    // port/1.21.3: 版本按 neoforge-21.3.97.pom 的实际依赖更新
    //   (21.1.77 时是 loader/earlydisplay 4.0.31 + bus 8.0.2)
    implementation "net.neoforged.fancymodloader:loader:5.0.8"
    implementation "net.neoforged.fancymodloader:earlydisplay:5.0.8"
    implementation "net.neoforged:bus:8.0.5"

    // Architectury
    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architecturyVersion}"

    // Mixin 注解 —— 21.3.97 自带 mixinextras 0.5.3
    annotationProcessor "io.github.llamalad7:mixinextras-neoforge:0.5.3"
    implementation "io.github.llamalad7:mixinextras-neoforge:0.5.3"

    // SpongePowered Mixin（NeoForge 自带但需要显式引入编译路径）
    // 21.3.97 声明的是 0.15.2+mixin.0.8.7
    implementation "net.fabricmc:sponge-mixin:0.15.2+mixin.0.8.7"

    // 引用 common 模块源码 (由下面的 sourceSets 直接加 srcDir; 不需要 project 依赖)
    // port/1.21.3 (移植必须): 这里原来还有一行 `implementation project(':common')`,
    //   而 common/build.gradle 里 `jar.enabled = false` (common 只提供源码) ——
    //   project 依赖于是把 :common:jar / :common:remapJar 拖进 :neoforge:build 的图里,
    //   remapJar 因 devlibs/common-*.jar 不存在而直接报
    //   "Input file does not exist ... common-<ver>-dev.jar", :neoforge:build 永远失败。
    //   删掉后与 fabric 模块写法一致 (fabric 本来就只有 sourceSets srcDir, 没有 project 依赖)。

    // port/1.21.3: neoforge 用 MC 1.21.3 + mojang official (runtime 也是 mojmap)
    minecraft "com.mojang:minecraft:${rootProject.minecraftVersion}"
    mappings loom.officialMojangMappings()
}

loom {
    // 2026-08-01: 显式使用 Mojang official mappings
    officialMojangMappings()

    mixin {
        defaultRefmapName = "chunkpilot.refmap.json"
    }

    runs {
        server {
            server()
        }
        client {
            client()
        }
    }
}

sourceSets {
    main {
        java {
            srcDir project(':common').sourceSets.main.java
        }
        resources {
            srcDir project(':common').sourceSets.main.resources
        }
    }
}

// NeoForge 1.21.1 runtime 使用 Mojang 命名 class,而 loom 默认输出 intermediary 命名 remapJar
// 会导致 NoClassDefFoundError (例如 class_2561 Component)。
// 解决方案: 禁用 remapJar + 后处理 refmap 为 Mojang 命名
tasks.named('remapJar').configure { enabled = false }

// 写一个 fixRefmap 任务, 把 jar 里的 refmap 替换成 Mojang 命名
tasks.register('fixRefmap') {
    doLast {
        def jarFile = file("$buildDir/devlibs/neoforge-${version}-dev.jar")
        if (!jarFile.exists()) {
            println "Jar not found: $jarFile"
            return
        }
        def tmpDir = file("$buildDir/tmp/fixrefmap")
        tmpDir.mkdirs()
        ant.unjar(src: jarFile, dest: tmpDir)
        
        // 写新的 Mojang 命名 refmap
        def refmapFile = file("$tmpDir/chunkpilot.refmap.json")
        refmapFile.text = '''{
  "mappings": {
    "com/chunkpilot/neoforge/mixin/ChunkMapMixin": {
      "updatePlayerPos": "Lnet/minecraft/server/level/ChunkMap;updatePlayerPos(Lnet/minecraft/server/level/ServerPlayer;)V",
      "move": "Lnet/minecraft/server/level/ChunkMap;move(Lnet/minecraft/server/level/ServerPlayer;)V"
    },
    "com/chunkpilot/neoforge/mixin/PlayerChunkSenderMixin": {
      "collectChunksToSend": "Lnet/minecraft/server/network/PlayerChunkSender;collectChunksToSend(Lnet/minecraft/server/level/ChunkMap;Lnet/minecraft/world/level/ChunkPos;)Ljava/util/List;"
    },
    "com/chunkpilot/neoforge/mixin/PlayerChunkSenderSendMixin": {
      "sendNextChunks": "Lnet/minecraft/server/network/PlayerChunkSender;sendNextChunks(Lnet/minecraft/server/level/ServerPlayer;)V"
    },
    "com/chunkpilot/neoforge/mixin/ServerPlayerMixin": {
      "teleportTo": "Lnet/minecraft/server/level/ServerPlayer;teleportTo(DDD)V"
    },
    "com/chunkpilot/neoforge/mixin/ChunkMapNonBlockingUnloadMixin": {
      "isExistingChunkFull": "Lnet/minecraft/server/level/ChunkMap;isExistingChunkFull(Lnet/minecraft/world/level/ChunkPos;)Z"
    }
  }
}
'''
        // 重打包
        ant.delete(file: jarFile)
        ant.zip(destfile: jarFile, basedir: tmpDir)
        println "Fixed refmap in $jarFile"
    }
}

// 让 jar 任务依赖 fixRefmap, 确保 build 后 refmap 是 Mojang 命名
afterEvaluate {
    tasks.named('jar').configure { finalizedBy('fixRefmap') }
}