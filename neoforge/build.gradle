// ==================================================================================
// 2026-09-24 (port/26.2): 整个文件按 MC 26.x 的现实重写 —— 改用 **NeoForge 官方插件**
//   `net.neoforged.moddev`(moddev-gradle), 不再用 architectury-loom + 手写 refmap。
//
// 为什么必须换 (逐条都有实证, 见 artifacts/26.2/REPORT.md §2):
//   1. MC 26.1 起**官方 jar 不再混淆**(26.2 的 server/client jar 里直接是
//      `net/minecraft/server/level/ChunkMap.class` 这种 Mojang 名, 0 个混淆类名)。
//   2. 因此 26.2 的 `version.json` 里**没有** `client_mappings`/`server_mappings`
//      ⇒ `loom.officialMojangMappings()` 直接抛
//      `RuntimeException: Failed to find official mojang mappings for 26.2`;
//      `net.fabricmc:intermediary:26.2` 也不存在(官方 meta 给的是 `0.0.0` = 空映射)。
//   3. 既然运行期命名空间 == 编译期命名空间, `remapJar` / 手写 Mojang refmap / `fixRefmap`
//      这一整套(本工程 1.21.x 时代为"禁用 remapJar + 后处理 refmap"付出的复杂度)**全部不需要**。
//   moddev-gradle 是 NeoForge 26.x 官方支持的构建方式(它读 `neoforge-<ver>-moddev-config.json`
//   装配 MC + NeoForge 的编译 classpath), 实测在本机 Gradle 9.6.1 + JDK 25 下 BUILD SUCCESSFUL。
// ==================================================================================
plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.147'
}

neoForge {
    // NeoForge 版本 (26.2 的正式版线; 见 REPORT §1 的坐标表)
    version = rootProject.neoforgeVersion
}

dependencies {
    // SpongePowered Mixin 注解(@Mixin/@Inject/@Shadow/@Accessor/@Invoker)。
    // 版本必须与 NeoForge 26.2.0.88 的 pom 一致(它自己依赖 sponge-mixin 0.17.3+mixin.0.8.7)。
    compileOnly "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
}

// 引用 common 源码 (不依赖 common 项目 —— common 关掉了 jar, 走 project 依赖会让构建图里
// 出现一个必然失败的 :common:jar)
sourceSets {
    main {
        java {
            srcDir project(':common').sourceSets.main.java
        }
        resources {
            srcDir project(':common').sourceSets.main.resources
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// 元数据里的 MC 版本区间与 mod 版本改为构建期展开, 不再手写
//   手写区间有两个坑: ① 漏改 ⇒ jar 在目标版本上被直接拒绝;
//   ② 写得过宽(如 [1.21.1,1.22)) ⇒ jar 被装到别的版本上也"允许加载",
//      然后以 mixin 目标缺失的形式崩在启动期, 比明确拒绝更难排查。
def _mc = project.property('minecraftVersion').toString()
def _mcParts = _mc.tokenize('.')
def _mcNext = (_mcParts[0..-2] + [(_mcParts[-1] as int) + 1]).join('.')
def mcRange = "[${_mc},${_mcNext})"

def modVer = project.property('modVersion').toString()

processResources {
    inputs.property "mcRange", mcRange
    inputs.property "modVersion", modVer
    filesMatching("META-INF/neoforge.mods.toml") {
        expand(mcRange: mcRange, modVersion: modVer)
    }
}

// 交付约定: 产物固定出现在 `neoforge/build/devlibs/neoforge-<modVersion>-dev.jar`
//   (工程其它版本的交付脚本都按这个路径取 neoforge 产物; 1.21.x 时代该路径来自
//    "remapJar 被禁用 ⇒ dev jar 落在 devlibs"。26.x 没有 remapJar, 所以这里显式镜像一份,
//    保证"取产物"的约定不变。)
tasks.register('devlibsJar', Copy) {
    dependsOn tasks.named('jar')
    from tasks.named('jar').flatMap { it.archiveFile }
    into layout.buildDirectory.dir('devlibs')
    rename { "neoforge-${modVer}-dev.jar" }
}

tasks.named('assemble') { finalizedBy 'devlibsJar' }

// 兼容主代理的标准构建命令里的 `-x remapSourcesJar`:
//   26.x 的不重映射构建**没有** remapSourcesJar/remapJar 任务(那是重映射 loom 才有的)。
//   这里注册同名空任务, 使 `-x remapSourcesJar` 在任何情况下都不会因"任务不存在"而失败。
tasks.register('remapSourcesJar') { group = 'loom'; description = 'no-op on unobfuscated MC 26.x' }
tasks.register('remapJar') { group = 'loom'; description = 'no-op on unobfuscated MC 26.x' }
