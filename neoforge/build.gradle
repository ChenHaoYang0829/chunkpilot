// =====================================================================================
// 2026-09-24  port/1.20.1: NeoForge 1.20.1 模块
//
// 关键结论 (踩了两天的坑, 别再试错的路径):
//   · 1.20.1 的 NeoForge artifact 名是 **forge**: `net.neoforged:forge:1.20.1-47.1.106`
//     (包命名空间仍是 `net.minecraftforge.*`; universal jar 里 1156 个 class, net/neoforged/ 0 个)
//   · 1.20.1 的生产运行期是 **Mojmap 类名 + SRG 成员名** (javap: MinecraftServer.m_129843_)
//     ⇒ 必须做 SRG 重混淆, main 那套"禁用 remapJar + 手写 refmap"在 1.20.1 上不可能work
//   · **能用的工具链是 ModDevGradle 的 legacyforge 子插件** (`net.neoforged.moddev.legacyforge`),
//     它就是为 1.17~1.20.1 + early NeoForge 1.20.1 做的: 开发环境=Mojmap (源码原样编译),
//     产物=`reobfJar` 自动转 SRG。
//     试过但**走不通**的: `net.neoforged.gradle.userdev` 7.0.171 在 Gradle 9.6.1 上
//     `NoSuchMethodError: GUtil.toCamelCase`; 7.1.39 能跑但给 1.20.1 的是 srg channel
//     (成员名 f_143034_), 源码是 Mojmap ⇒ 编不过, 且 `minecraft { mappings { official() } }`
//     对 1.20.1 不生效。
//   · 产物路径: **`build/libs/chunkpilot-<modVersion>-neoforge.jar`** (已经 reobfJar 成 SRG)。
//     不是 build/devlibs/ —— 那是旧 loom 方案的路径。
// =====================================================================================

plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.147'
}

version = rootProject.modVersion
group = rootProject.modGroup

repositories {
    maven { url = file("../.local-maven-repo") }
    maven { url "https://maven.neoforged.net/releases/" }
    maven { url "https://maven.minecraftforge.net/" }
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

legacyForge {
    enable {
        // 1.20.1 的 NeoForge (artifact 名 forge)。走 net.neoforged:forge
        neoForgeVersion = rootProject.neoforgeVersion
        // 交付 jar 必须是 SRG (生产运行期就是 SRG 成员名)
        obfuscateJar = true
    }
    // mixin refmap: legacyforge 的 MixinExtension 会按 inMappings/outMappings 生成 SRG refmap
    // (由下方 `mixin { }` 块注册配置)
}

// mixin 配置注册 (插件注册了名为 `mixin` 的扩展)
//   `config` = mixin 配置文件名; `add(sourceSet, refmapName)` = 要生成的 refmap 文件名
//   (二者别搞混: 一开始把配置名传进 add(), 结果 refmap 也叫 chunkpilot.mixins.json →
//    jar 里和 src/main/resources 的同名文件撞车, :neoforge:jar 直接失败)
mixin {
    config 'chunkpilot.mixins.json'
    add sourceSets.main, 'chunkpilot.refmap.json'
}

// common 模块源码直接并进本模块编译 (与 fabric/neoforge 其它版本一致; 不写 project(':common') 以免拖进 :common:remapJar)
sourceSets {
    main {
        java {
            srcDir project(':common').sourceSets.main.java
        }
        resources {
            srcDir project(':common').sourceSets.main.resources
        }
    }
}

dependencies {
    // Mixin 注解处理器 (生成 refmap)
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly 'org.spongepowered:mixin:0.8.5'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 交付产物名固定成 chunkpilot-<modVersion>-neoforge.jar, 便于 artifacts/1.20.1 落地
tasks.named('jar', Jar).configure {
    archiveFileName = "chunkpilot-${project.version}-neoforge.jar"
    // 兜底: 资源目录与生成物万一重名, 以先到的为准而不是让构建失败
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// reobfJar 的输出同样命名, 保证交付的是 SRG 版
afterEvaluate {
    tasks.matching { it.name == 'reobfJar' }.configureEach { t ->
        t.archiveFileName.set("chunkpilot-${project.version}-neoforge.jar")
    }
}
