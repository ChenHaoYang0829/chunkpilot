repositories {
    maven { url = file("../.local-maven-repo") }
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        // 本地仓库有 11.0.4 但 loader 要求 11.0.3，强制用 11.0.4
        if (details.requested.group == 'cpw.mods' && details.requested.name == 'modlauncher') {
            details.useVersion '11.0.4'
        }
        // 本地仓库有 3.0.8 但 loader 要求 3.0.7，强制用 3.0.8
        if (details.requested.group == 'cpw.mods' && details.requested.name == 'securejarhandler') {
            details.useVersion '3.0.8'
        }
    }
}

// 2026-09-24 死代码清理: 这里原有 architectury { platformSetupLoomIde(); neoForge { platformPackage = "forge" } }。
//   `platformPackage` 只服务 Architectury 的 @ExpectPlatform 代码生成, 而本项目**零处使用** @ExpectPlatform
//   (平台实现是各模块直接 implements + 入口显式构造注入); `platformSetupLoomIde()` 只影响 IDE/run-config。
//   实测移除后 :common:test / :neoforge:build 均通过。
dependencies {
    modImplementation "net.neoforged:neoforge:${rootProject.neoforgeVersion}"

    // 显式添加 FancyModLoader 和 Bus（NeoForge 的传递依赖，但 NeoForge Maven 无法自动解析）
    // port/1.21.10: 版本按 neoforge-21.10.64.pom 对齐 (FML 10.0.32 / bus 8.0.5)
    implementation "net.neoforged.fancymodloader:loader:10.0.32"
    implementation "net.neoforged.fancymodloader:earlydisplay:10.0.32"
    implementation "net.neoforged:bus:8.0.5"

    // 2026-09-24 死代码清理: 删掉 architectury-neoforge 依赖 —— 全仓库 Java 里 "architectury" 只出现在注释中,
    //   @ExpectPlatform 0 处, neoforge 编译产物里 0 个类引用它。**注意它同时是 neoforge.mods.toml 里
    //   type="required" 的依赖**, 也就是说玩家被强制安装一个本模组完全用不到的 Architectury API ——
    //   那条声明也已一并删除(见 META-INF/neoforge.mods.toml)。

    // Mixin 注解
    // 2026-09-24 死代码盘点: mixinextras **完全未使用** (全仓库 0 处 WrapOperation/
    //   ModifyExpressionValue/WrapWithCondition/ModifyReturnValue/@Local/@Share/llamalad7),
    //   实际用到的全是 Sponge 原生注解; 实测删除后 :neoforge:build 仍 BUILD SUCCESSFUL。

    // SpongePowered Mixin（NeoForge 自带但需要显式引入编译路径; 21.10.64 = 0.16.5+mixin.0.8.7）
    implementation "net.fabricmc:sponge-mixin:0.16.5+mixin.0.8.7"

    // common 模块源码由下面 sourceSets.srcDir 直接引入并随本模块一起编译,
    // 因此**不能**再写 `implementation project(':common')` —— 那会把 :common:remapJar
    // 拖进构建图, 而 common 关掉了 jar (jar.enabled=false), 该任务必然失败,
    // 导致整个 :neoforge:build 崩掉 (2026-09-20 实测: 唯一失败任务就是它)。

    // 2026-08-01: neoforge 用 MC 1.21.1 + mojang official
    minecraft "com.mojang:minecraft:${rootProject.minecraftVersion}"
    mappings loom.officialMojangMappings()
}

loom {
    // 2026-08-01: 显式使用 Mojang official mappings
    officialMojangMappings()

    mixin {
        defaultRefmapName = "chunkpilot.refmap.json"
    }

    runs {
        server {
            server()
        }
        client {
            client()
        }
    }
}

sourceSets {
    main {
        java {
            srcDir project(':common').sourceSets.main.java
        }
        resources {
            srcDir project(':common').sourceSets.main.resources
        }
    }
}

// NeoForge 1.21.1 runtime 使用 Mojang 命名 class,而 loom 默认输出 intermediary 命名 remapJar
// 会导致 NoClassDefFoundError (例如 class_2561 Component)。
// 解决方案: 禁用 remapJar + 后处理 refmap 为 Mojang 命名
tasks.named('remapJar').configure { enabled = false }

// 写一个 fixRefmap 任务, 把 jar 里的 refmap 替换成 Mojang 命名
tasks.register('fixRefmap') {
    doLast {
        def jarFile = file("$buildDir/devlibs/neoforge-${version}-dev.jar")
        if (!jarFile.exists()) {
            println "Jar not found: $jarFile"
            return
        }
        def tmpDir = file("$buildDir/tmp/fixrefmap")
        tmpDir.mkdirs()
        ant.unjar(src: jarFile, dest: tmpDir)
        
        // 写新的 Mojang 命名 refmap
        //
        // port/1.21.10: 这里的 descriptor 全部按 **1.21.10 服务端 jar 的 javap 实证** 重写过,
        //   并与 `neoforge/src/main/resources/chunkpilot.mixins.json` 注册的 mixin 集合对齐
        //   (下面还有一段一致性校验, 集合不一致就直接让构建失败, 避免"编译通过但启动崩溃").
        //   javap 证据 (minecraft-merged 1.21.10, Mojang official mappings):
        //     ChunkMap.updatePlayerPos(ServerPlayer)V          private
        //     ChunkMap.move(ServerPlayer)V                     public
        //     PlayerChunkSender.collectChunksToSend(ChunkMap, ChunkPos)List   private
        //     PlayerChunkSender.sendNextChunks(ServerPlayer)V  public
        //     ServerPlayer.teleportTo(DDD)V                    public
        //     Connection.send(Packet, ChannelFutureListener, boolean)V  public   ← 1.21.10 变化点
        //     Connection.channelRead0(ChannelHandlerContext, Packet)V   protected
        def refmapFile = file("$tmpDir/chunkpilot.refmap.json")
        refmapFile.text = '''{
  "mappings": {
    "com/chunkpilot/neoforge/mixin/ChunkMapMixin": {
      "updatePlayerPos": "Lnet/minecraft/server/level/ChunkMap;updatePlayerPos(Lnet/minecraft/server/level/ServerPlayer;)V",
      "move": "Lnet/minecraft/server/level/ChunkMap;move(Lnet/minecraft/server/level/ServerPlayer;)V"
    },
    "com/chunkpilot/neoforge/mixin/ConnectionNetTrackerMixin": {
      "send": "Lnet/minecraft/network/Connection;send(Lnet/minecraft/network/protocol/Packet;Lio/netty/channel/ChannelFutureListener;Z)V",
      "channelRead0": "Lnet/minecraft/network/Connection;channelRead0(Lio/netty/channel/ChannelHandlerContext;Lnet/minecraft/network/protocol/Packet;)V"
    },
    "com/chunkpilot/neoforge/mixin/PlayerChunkSenderMixin": {
      "collectChunksToSend": "Lnet/minecraft/server/network/PlayerChunkSender;collectChunksToSend(Lnet/minecraft/server/level/ChunkMap;Lnet/minecraft/world/level/ChunkPos;)Ljava/util/List;"
    },
    "com/chunkpilot/neoforge/mixin/PlayerChunkSenderSendMixin": {
      "sendNextChunks": "Lnet/minecraft/server/network/PlayerChunkSender;sendNextChunks(Lnet/minecraft/server/level/ServerPlayer;)V"
    },
    "com/chunkpilot/neoforge/mixin/ServerPlayerMixin": {
      "teleportTo": "Lnet/minecraft/server/level/ServerPlayer;teleportTo(DDD)V"
    }
  }
}
'''

        // ---- 一致性校验: refmap 里必须覆盖 chunkpilot.mixins.json 注册的每个 mixin 类 ----
        // CheckExtensibleEnumsMixin 是 `@Mixin(targets = "net.neoforged...", remap = false)`,
        // 目标是 NeoForge 自己的类 (非 MC 命名), 按设计不进 refmap。
        def mixinsJson = file('src/main/resources/chunkpilot.mixins.json')
        def declared = new groovy.json.JsonSlurper().parse(mixinsJson).mixins as List
        def noRefmap = ['CheckExtensibleEnumsMixin'] as Set
        def mapped = new groovy.json.JsonSlurper().parse(refmapFile).mappings.keySet()
            .collect { it.substring(it.lastIndexOf('/') + 1) } as Set
        def missing = declared.findAll { !noRefmap.contains(it) && !mapped.contains(it) }
        def extra = mapped.findAll { !declared.contains(it) }
        if (missing || extra) {
            ant.delete(file: jarFile)
            throw new GradleException(
                "fixRefmap 与 chunkpilot.mixins.json 不一致: 缺 refmap 条目=$missing, 多余条目=$extra. " +
                "请同步 neoforge/build.gradle 里硬编码的 refmap JSON (每次换 MC 版本都要对 descriptor).")
        }
        println "fixRefmap: refmap 覆盖 mixin 集合校验通过 (${declared.size()} 个注册, ${mapped.size()} 个有 refmap)"
        // 重打包
        ant.delete(file: jarFile)
        ant.zip(destfile: jarFile, basedir: tmpDir)
        println "Fixed refmap in $jarFile"
    }
}

// 让 jar 任务依赖 fixRefmap, 确保 build 后 refmap 是 Mojang 命名
afterEvaluate {
    tasks.named('jar').configure { finalizedBy('fixRefmap') }
}
// 2026-09-24: 元数据里的 MC 版本区间改为构建期从 rootProject.minecraftVersion 计算, 不再手写。
//   手写区间有两个坑: ① 漏改 ⇒ jar 在目标版本上被直接拒绝;
//   ② 写得过宽(如 [1.21.1,1.22)) ⇒ jar 被装到别的 1.21.x 上也"允许加载",
//      然后以 mixin 目标缺失的形式崩在启动期, 比明确拒绝更难排查。
def _mc = project.property('minecraftVersion').toString()
def _mcParts = _mc.tokenize('.')
def _mcNext = (_mcParts[0..-2] + [(_mcParts[-1] as int) + 1]).join('.')
def mcRange = "[${_mc},${_mcNext})"

processResources {
    inputs.property "mcRange", mcRange
    filesMatching("META-INF/neoforge.mods.toml") {
        expand(mcRange: mcRange)
    }
}
