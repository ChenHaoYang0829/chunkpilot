org.gradle.jvmargs=-Xmx3G

# 26.3 需要 Java 25 (server.jar 内层 version.json: "java_version": 25, "java_component": "java-runtime-epsilon")
org.gradle.java.installations.paths=/usr/lib/jvm/jdk-25.0.4-oracle-x64

# 外网下载 (fabric-api / neoforge / MC jar) 走本机 HTTP 代理
# systemProp.http.proxyHost=YOUR_PROXY_HOST
# systemProp.http.proxyPort=YOUR_PROXY_PORT
# systemProp.https.proxyHost=YOUR_PROXY_HOST
# systemProp.https.proxyPort=YOUR_PROXY_PORT
systemProp.http.nonProxyHosts=localhost|127.0.0.1

# 2026-09-24 (26.3): 本机代理在拉 MC 依赖 (lwjgl-vulkan / neoforge-universal / client.jar, 数十 MB) 时
#   偶发 "Read timed out" —— Gradle 默认 socket timeout 30s 太小, 直接让 :common:compileJava 失败。
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
